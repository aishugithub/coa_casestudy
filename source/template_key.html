<!DOCTYPE html>
<!--
  TEACHER ANSWER KEY — Unit 5 case study.  FOR THE TEACHER'S LAPTOP ONLY.
  Do NOT upload this file to GitHub (it is listed in .gitignore).
  Open it in a browser and project it after everyone has submitted.
  Generated by build.py from cases.py.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 5 Case Study — Answer Key (Teacher)</title>
<style>
  :root { --blue:#2c6fb8; --ink:#1c2430; --muted:#5c6672; --bg:#f7f6f3; --card:#fff; --line:#e3e0da;
          --ok:#2f8a3c; --ok-bg:#eaf7ec; --chip:#eef4fb; --story:#fffdf7; --head:#f1f4f8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e7ebf0; --muted:#9aa5b1; --bg:#12161c; --card:#1a2028; --line:#2b333d;
            --ok:#7fd08c; --ok-bg:#15261a; --chip:#16283c; --story:#1d232c; --head:#222a35; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
         font-size:19px; line-height:1.55; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 20px 60px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:15px; margin-bottom:16px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
  .tab, .btn { font:inherit; font-size:15px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--ink);
               border-radius:999px; padding:8px 16px; cursor:pointer; }
  .tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
  .btn { border-radius:9px; }
  .spacer { flex:1; }
  details.case { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 18px; margin:18px 0; }
  details.case summary { cursor:pointer; font-weight:700; }
  .story { background:var(--story); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-top:10px; font-size:17px; }
  .story p { margin:0 0 8px; }
  table { border-collapse:collapse; width:100%; font-size:15px; margin-top:8px; }
  th, td { border:1px solid var(--line); padding:6px 9px; text-align:left; }
  th { background:var(--head); }
  .ex-title { font-weight:700; font-size:15px; margin-top:14px; }
  h2.part { font-size:21px; margin:28px 0 8px; color:var(--blue); }
  .q { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin:12px 0; }
  .qhead { display:flex; gap:12px; align-items:flex-start; }
  .qnum { font-weight:800; color:var(--blue); min-width:48px; }
  .qtext { font-weight:600; flex:1; }
  .opts { list-style:none; margin:10px 0 0 60px; padding:0; }
  .opts li { padding:6px 12px; border-radius:8px; margin:4px 0; border:1px solid transparent; }
  .opts li .L { font-weight:700; margin-right:8px; color:var(--muted); }
  .q.shown .opts li.right { background:var(--ok-bg); border-color:var(--ok); font-weight:700; }
  .q.shown .opts li.right .L { color:var(--ok); }
  .q.shown .opts li.right::after { content:"  ✓"; color:var(--ok); }
  .why { display:none; margin:10px 0 0 60px; padding:10px 14px; background:var(--chip); border-radius:8px; font-size:17px; }
  .q.shown .why { display:block; }
  .reveal { margin-left:auto; }
  .debrief { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 20px; margin-top:24px; font-size:16px; }
  .debrief li { margin:4px 0; }
  .note { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Unit 5 Case Study — Answer Key</h1>
  <div class="sub">CSE23CT201 · Teacher's copy, for projecting after everyone has submitted. Students see different option orders on their phones, so talk about the <b>answer text</b>, not the letter.</div>
  <div class="bar" id="bar"></div>
  <div id="main"></div>
</div>
<script>
const CASES = __CASES__;
const WHY = __WHY__;
let current = Object.keys(CASES)[0];

function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mixed(arr, seedStr){ const a = arr.slice(); let s = hashStr(seedStr);
  for (let i=a.length-1;i>0;i--){ s = Math.imul(s ^ (s >>> 15), 2246822507) >>> 0; const j = s % (i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function renderBar(){
  document.getElementById("bar").innerHTML =
    Object.keys(CASES).map(k => '<button class="tab '+(k===current?"active":"")+'" onclick="pick(\''+k+'\')">'+esc(CASES[k].dept)+'</button>').join("") +
    '<span class="spacer"></span><button class="btn" onclick="showAll(true)">Reveal all</button><button class="btn" onclick="showAll(false)">Hide all</button>';
}
function renderCase(){
  const c = CASES[current];
  let h = '<details class="case"><summary>📄 The case: “'+esc(c.title)+'” — '+esc(c.subtitle)+' (click to show)</summary><div class="story">' +
    c.story.map(p => '<p>'+p+'</p>').join("") + '</div>';
  c.exhibits.forEach(ex => {
    h += '<div class="ex-title">'+esc(ex.title)+'</div><table><thead><tr>'+ex.head.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>' +
      ex.rows.map(r => '<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join("")+'</tr>').join("") + '</tbody></table>';
  });
  h += '</details>';
  const titles = { A:"Part A — Find the facts", B:"Part B — Link to concepts", C:"Part C — Decide", D:"Part D — Recommend" };
  let n = 0;
  ["A","B","C","D"].forEach(p => {
    h += '<h2 class="part">'+titles[p]+'</h2>';
    c.parts[p].forEach(q => {
      n++;
      h += '<div class="q" id="q_'+q.id+'"><div class="qhead"><span class="qnum">Q'+n+'</span><span class="qtext">'+esc(q.text)+'</span>' +
        '<button class="btn reveal" onclick="toggle(\''+q.id+'\')">Show answer</button></div><ul class="opts">' +
        mixed(q.options, current+q.id).map((o,i) => '<li class="'+(o===q.answer?"right":"")+'"><span class="L">'+"ABCD"[i]+'.</span>'+esc(o)+'</li>').join("") +
        '</ul><div class="why">💡 '+esc(WHY[current][q.id]||"")+'</div></div>';
    });
  });
  h += '<div class="debrief"><b>Debrief points for this case</b><ul>' + c.debrief.map(d => '<li>'+esc(d)+'</li>').join("") + '</ul>' +
    '<div class="note">Tip: open the Google Sheet’s <b>Summary</b> tab first and start with the questions marked “⚠ discuss in class”.</div></div>';
  document.getElementById("main").innerHTML = h;
}
function toggle(id){
  const el = document.getElementById("q_"+id); el.classList.toggle("shown");
  el.querySelector(".reveal").textContent = el.classList.contains("shown") ? "Hide answer" : "Show answer";
}
function showAll(show){
  document.querySelectorAll(".q").forEach(el => { el.classList.toggle("shown", show);
    el.querySelector(".reveal").textContent = show ? "Hide answer" : "Show answer"; });
}
function pick(k){ current = k; renderBar(); renderCase(); window.scrollTo({top:0}); }
renderBar(); renderCase();
</script>
</body>
</html>
