<!DOCTYPE html>
<!--
  ============================================================================
  COA UNIT 5 — I/O ORGANIZATION CASE STUDY (auto-scored, coa_avps pattern)
  ============================================================================
  WHAT THIS FILE IS:
  A single-page case-study assignment. Per student it:
    1. Collects identity (Register Number, Name, Department).
    2. Shows the department's CASE (story + exhibits). The case can be reopened
       from every later screen ("View case" button), as in a real case class.
    3. Asks 13 MCQs in four parts:  A Find the facts · B Link to concepts ·
       C Decide · D Recommend.  Question order and option order are shuffled per student
       (seeded from the register number, so a refresh shows the same order).
    4. Part D: one MCQ — the best overall recommendation. Everything is MCQ.
    5. POSTs one flat JSON record to the Apps Script Web App (Code.gs), which
       scores it against the answer key and updates the Summary tab.

  GENERATED by build.py from cases.py — edit cases.py and rebuild, so the page
  and the answer key in Code.gs can never drift apart.

  BEFORE GOING LIVE: set CONFIG.APPS_SCRIPT_URL (see SETUP.md).
  Teacher shortcut: add ?case=cyber | aiml | ece to the URL to fix the case.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COA Unit 5 — Case Study</title>
<style>
  :root {
    --blue:#2c6fb8; --blue-dark:#245c99; --ink:#1c2430; --muted:#5c6672;
    --cream:#f7f6f3; --card:#ffffff; --line:#e3e0da; --ok:#2f8a3c;
    --chip:#eef4fb; --chip-line:#b9d4ef; --story:#fffdf7; --radius:12px;
    --ex-head:#f1f4f8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; }
  .wrap { max-width:780px; margin:0 auto; padding:24px 16px 80px; }
  header.top { text-align:center; margin-bottom:8px; }
  header.top h1 { font-size:22px; margin:0 0 4px; }
  header.top .sub { color:var(--muted); font-size:14px; }
  .steps { display:flex; gap:6px; justify-content:center; margin:18px 0 24px; flex-wrap:wrap; }
  .step { font-size:12px; color:var(--muted); padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); }
  .step.active { color:#fff; background:var(--blue); border-color:var(--blue); font-weight:600; }
  .step.done { color:var(--ok); border-color:#bfe0c4; background:#f0f9f1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:18px; }
  .card h2 { margin:0 0 6px; font-size:19px; }
  .card h3 { margin:20px 0 8px; font-size:15px; }
  .lead { color:var(--muted); font-size:14px; margin:0 0 14px; }
  label.field { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  input[type=text], select { width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  input#regno { text-transform:uppercase; letter-spacing:0.5px; }
  .hint { font-size:12.5px; color:var(--muted); margin-top:5px; }
  .badge { display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.3px; padding:2px 9px; border-radius:999px; margin-bottom:6px;
    background:#eaf2fb; color:#255a94; border:1px solid #c7ddf3; }
  .story { background:var(--story); border:1px solid var(--line); border-radius:10px; padding:16px 18px; font-size:15px; }
  .story p { margin:0 0 10px; }
  .story p:last-child { margin-bottom:0; }
  .exhibit { margin-top:16px; }
  .exhibit .ex-title { font-size:13.5px; font-weight:700; margin-bottom:6px; }
  .tbl-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th, td { border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top; }
  th { background:var(--ex-head); font-weight:600; }
  td code, .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .howto { background:var(--chip); border:1px solid var(--chip-line); border-radius:10px; padding:10px 14px; font-size:13.5px; margin:14px 0 0; }
  .q { padding:14px 0; border-top:1px solid var(--line); }
  .q:first-of-type { border-top:none; }
  .q .qtext { font-weight:600; font-size:14.5px; margin-bottom:8px; }
  .q .qtext .num { color:var(--blue); margin-right:6px; }
  .opts { display:flex; flex-direction:column; gap:8px; }
  .opts.row { flex-direction:row; flex-wrap:wrap; }
  .opt { display:flex; align-items:flex-start; gap:9px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; cursor:pointer; background:var(--card); user-select:none; }
  .opt:hover { border-color:var(--blue); }
  .opt input { accent-color:var(--blue); margin-top:4px; }
  .opt.checked { border-color:var(--blue); background:var(--chip); }
  textarea { width:100%; min-height:110px; padding:10px 12px; font-size:14px; border:1px solid var(--line); border-radius:8px; resize:vertical; font-family:inherit; background:var(--card); color:var(--ink); }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:10px; }
  button { font-size:15px; font-weight:600; border:none; border-radius:9px; padding:11px 20px; cursor:pointer; }
  button.primary { background:var(--blue); color:#fff; }
  button.primary:hover { background:var(--blue-dark); }
  button.primary:disabled { background:#9db8d6; cursor:not-allowed; }
  button.ghost { background:var(--card); color:var(--blue); border:1px solid var(--line); }
  .err { color:#c0392b; font-size:13px; margin-top:10px; min-height:18px; }
  .done-tick { font-size:40px; text-align:center; }
  .summary { font-size:13.5px; color:var(--muted); background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:12px; }
  #caseBtn { position:fixed; right:16px; bottom:16px; z-index:20; box-shadow:0 4px 14px rgba(0,0,0,.18); display:none; }
  #drawer { position:fixed; inset:0; background:rgba(15,20,28,.55); z-index:30; display:none; }
  #drawer .panel { position:absolute; right:0; top:0; bottom:0; width:min(640px,100%); background:var(--cream); overflow-y:auto; padding:18px 16px 40px; }
  #drawer .panel .close { position:sticky; top:0; float:right; }
  .part-intro { font-size:13.5px; color:var(--muted); margin:-2px 0 6px; }
  @media (prefers-color-scheme: dark) {
    :root { --cream:#12161c; --card:#1a2028; --ink:#e7ebf0; --muted:#9aa5b1; --line:#2b333d; --chip:#16283c; --chip-line:#2a4a6a; --story:#1d232c; --ex-head:#222a35; }
    .badge { background:#16283c; color:#9cc4ee; border-color:#2a4a6a; }
    .step.done { background:#15261a; border-color:#2b5a35; color:#7fd08c; }
    #caseBtn { box-shadow:0 4px 14px rgba(0,0,0,.5); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Unit 5 Case Study — Input/Output Organization</h1>
    <div class="sub">Computer Organization &amp; Architecture (CSE23CT201)</div>
  </header>
  <div class="steps" id="steps"></div>
  <div id="screen"></div>
  <div class="err" id="err"></div>
  <div class="nav">
    <button class="ghost" id="backBtn" onclick="goBack()" style="visibility:hidden">← Back</button>
    <button class="primary" id="nextBtn" onclick="goNext()">Start →</button>
  </div>
</div>
<button class="primary" id="caseBtn" onclick="openCase()">📄 View case</button>
<div id="drawer" onclick="if(event.target===this)closeCase()"><div class="panel" id="drawerPanel"></div></div>

<script>
/* ==========================================================================
   CONFIG
   ========================================================================== */
const CONFIG = {
  APPS_SCRIPT_URL: "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"
};

/* Case content (generated from cases.py — no answers here; the key lives in Code.gs). */
const CASES = __CASES__;

const PART_INFO = {
  A: { title:"Part A — Find the facts",     intro:"Answer from what the case and its exhibits say. Use “View case” whenever you need to look again." },
  B: { title:"Part B — Link to concepts",   intro:"Use what you learnt in class to explain what happened in the case." },
  C: { title:"Part C — Decide",             intro:"You are the engineer in the case. Choose what you would do." },
  D: { title:"Part D — Recommend",          intro:"Pick the best overall recommendation the engineer should give." }
};

/* ==========================================================================
   Deterministic shuffle seeded from the register number (stable on refresh)
   ========================================================================== */
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, r){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildPlan(regno, caseId){
  const c = CASES[caseId];
  const r = rng(hashStr(regno + "|" + caseId));
  const parts = {};
  ["A","B","C","D"].forEach(p => {
    parts[p] = shuffled(c.parts[p], r).map(q => ({ id:q.id, text:q.text, options: shuffled(q.options, r) }));
  });
  return { caseId, parts };
}

/* ==========================================================================
   STATE  — screens: 0 identity · 1 read case · 2 A · 3 B · 4 C · 5 recommend · 6 done
   ========================================================================== */
const STEP_LABELS = ["Start","Read the case","Part A","Part B","Part C","Part D","Done"];
const state = { screen:0, plan:null, answers:{}, t0:Date.now(), tRead:null };
const screenEl = document.getElementById("screen");
const errEl = document.getElementById("err");
const nextBtn = document.getElementById("nextBtn");
const backBtn = document.getElementById("backBtn");
const stepsEl = document.getElementById("steps");
const caseBtn = document.getElementById("caseBtn");

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function urlCase(){ const m = location.search.match(/[?&]case=(\w+)/); return m && CASES[m[1]] ? m[1] : null; }

/* ---- Case rendering (used on the reading screen and in the drawer) ---- */
function caseHTML(c){
  let h = '<span class="badge">'+esc(c.dept)+'</span><h2>'+esc(c.title)+'</h2><p class="lead">'+esc(c.subtitle)+'</p>';
  h += '<div class="story">' + c.story.map(p => '<p>'+p+'</p>').join("") + '</div>';   // story is trusted, authored HTML
  c.exhibits.forEach(ex => {
    h += '<div class="exhibit"><div class="ex-title">'+esc(ex.title)+'</div><div class="tbl-wrap"><table><thead><tr>' +
      ex.head.map(x => '<th>'+esc(x)+'</th>').join("") + '</tr></thead><tbody>' +
      ex.rows.map(r => '<tr>'+r.map(x => '<td>'+esc(x)+'</td>').join("")+'</tr>').join("") + '</tbody></table></div></div>';
  });
  return h;
}
function openCase(){
  const c = CASES[state.plan.caseId];
  document.getElementById("drawerPanel").innerHTML =
    '<button class="ghost close" onclick="closeCase()">Close ✕</button><div class="card" style="margin-top:44px">'+caseHTML(c)+'</div>';
  document.getElementById("drawer").style.display = "block";
}
function closeCase(){ document.getElementById("drawer").style.display = "none"; }

/* ---- Screens ---- */
function renderIdentity(){
  const fixed = urlCase();
  const opts = Object.keys(CASES).map(k => '<option value="'+k+'" '+((state.answers.caseId||fixed)===k?"selected":"")+'>'+esc(CASES[k].dept)+'</option>').join("");
  return '<div class="card"><h2>Before you begin</h2>' +
    '<p class="lead">You will read a short real-life case about how a processor talks to its I/O devices, then answer 13 multiple-choice questions. About 25 minutes.</p>' +
    '<label class="field" for="regno">Register Number</label>' +
    '<input type="text" id="regno" autocomplete="off" placeholder="e.g. E0225001" value="'+esc(state.answers.regno||"")+'" oninput="this.value=this.value.toUpperCase()">' +
    '<label class="field" for="name">Name</label>' +
    '<input type="text" id="name" autocomplete="off" placeholder="Your full name" value="'+esc(state.answers.name||"")+'">' +
    '<label class="field" for="dept">Department</label>' +
    '<select id="dept" '+(fixed?"disabled":"")+'><option value="">— choose —</option>'+opts+'</select>' +
    '<div class="hint">Your case depends on your department.</div></div>';
}
function renderRead(){
  return '<div class="card">' + caseHTML(CASES[state.plan.caseId]) +
    '<div class="howto">📖 Read the whole case and both exhibits carefully. You can open the case again at any time using the <b>View case</b> button.</div></div>';
}
function renderPart(p){
  const qs = state.plan.parts[p];
  const start = { A:0, B:4, C:8, D:12 }[p];
  let h = '<div class="card"><h2>'+PART_INFO[p].title+'</h2><p class="part-intro">'+PART_INFO[p].intro+'</p>';
  qs.forEach((q,i) => {
    h += '<div class="q"><div class="qtext"><span class="num">Q'+(start+i+1)+'.</span>'+esc(q.text)+'</div><div class="opts">';
    q.options.forEach(o => {
      const ck = state.answers[q.id] === o;
      h += '<label class="opt '+(ck?"checked":"")+'"><input type="radio" name="'+q.id+'" value="'+esc(o)+'" '+(ck?"checked":"")+' onchange="onPick(this)"><span>'+esc(o)+'</span></label>';
    });
    h += '</div></div>';
  });
  return h + '</div>';
}
function renderDone(){
  return '<div class="card"><div class="done-tick">✓</div><h2 style="text-align:center">Submitted — thank you!</h2>' +
    '<p class="lead" style="text-align:center">Your answers have been recorded. We will discuss the case together in class.</p>' +
    '<div class="summary">Register: <b>'+esc(state.answers.regno)+'</b><br>Case: <b>'+esc(CASES[state.plan.caseId].title)+'</b> ('+esc(CASES[state.plan.caseId].dept)+')</div></div>';
}

function onPick(input){
  state.answers[input.name] = input.value;
  document.querySelectorAll('input[name="'+input.name+'"]').forEach(r => r.closest(".opt").classList.toggle("checked", r.checked));
  errEl.textContent = "";
}
function paintSteps(){
  stepsEl.innerHTML = STEP_LABELS.slice(0,6).map((L,i) => {
    const cls = i===state.screen ? "step active" : (i<state.screen ? "step done" : "step");
    return '<div class="'+cls+'">'+L+'</div>';
  }).join("");
}
function render(){
  paintSteps();
  const s = state.screen;
  caseBtn.style.display = (s >= 2 && s <= 5) ? "block" : "none";
  if (s === 0) { screenEl.innerHTML = renderIdentity(); nextBtn.textContent = "Start →"; }
  else if (s === 1) { screenEl.innerHTML = renderRead(); nextBtn.textContent = "I have read the case →"; }
  else if (s >= 2 && s <= 5) { screenEl.innerHTML = renderPart("ABCD"[s-2]); nextBtn.textContent = s === 5 ? "Submit ✓" : "Next →"; }
  else { screenEl.innerHTML = renderDone(); nextBtn.style.display = "none"; backBtn.style.visibility = "hidden"; return; }
  backBtn.style.visibility = s === 0 ? "hidden" : "visible";
  errEl.textContent = "";
  window.scrollTo({ top:0, behavior:"smooth" });
}

function validateCurrent(){
  const s = state.screen;
  if (s === 0){
    const regno = (document.getElementById("regno").value||"").trim().toUpperCase().replace(/\s+/g,"");
    const name  = (document.getElementById("name").value||"").trim();
    const caseId = urlCase() || document.getElementById("dept").value;
    if (!regno) return "Please enter your Register Number.";
    if (!name)  return "Please enter your name.";
    if (!caseId) return "Please choose your department.";
    if (state.plan && (state.answers.regno !== regno || state.answers.caseId !== caseId)) {
      // identity changed after starting: clear old answers so the new shuffle is consistent
      const keep = {}; state.answers = keep;
    }
    state.answers.regno = regno; state.answers.name = name; state.answers.caseId = caseId;
    state.answers.dept = CASES[caseId].dept;
    state.plan = buildPlan(regno, caseId);
    return null;
  }
  if (s === 1){ if (!state.tRead) state.tRead = Date.now(); return null; }
  if (s >= 2 && s <= 5){
    for (const q of state.plan.parts["ABCD"[s-2]]) if (!state.answers[q.id]) return "Please answer all questions before continuing.";
    return null;
  }
  return null;
}
function goNext(){ const p = validateCurrent(); if (p){ errEl.textContent = p; return; } if (state.screen === 5){ submit(); return; } state.screen++; render(); }
function goBack(){ if (state.screen === 0) return; state.screen--; render(); }

async function submit(){
  errEl.textContent = ""; nextBtn.disabled = true; nextBtn.textContent = "Submitting…";
  const now = Date.now();
  const record = Object.assign({
    submittedAt: new Date().toISOString(),
    readSeconds: state.tRead ? Math.round((state.tRead - state.t0)/1000) : "",
    totalSeconds: Math.round((now - state.t0)/1000),
    userAgent: navigator.userAgent
  }, state.answers);
  if (CONFIG.APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
    nextBtn.disabled = false; nextBtn.textContent = "Submit ✓";
    errEl.textContent = "This form isn't connected yet (APPS_SCRIPT_URL not set). Please tell your professor."; return;
  }
  try {
    await fetch(CONFIG.APPS_SCRIPT_URL, { method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(record) });
    state.screen = 6; render();
  } catch(e){
    nextBtn.disabled = false; nextBtn.textContent = "Submit ✓";
    errEl.textContent = "Couldn't submit — please check your connection and try again. (Your answers are still here.)";
  }
}

render();
</script>
</body>
</html>
